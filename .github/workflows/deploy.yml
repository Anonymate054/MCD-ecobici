name: Ecobici Data Lake — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # needed to post plan diff as PR comment

env:
  AWS_REGION:        ${{ secrets.AWS_REGION }}
  TF_VERSION:        "1.8.5"
  PYTHON_VERSION:    "3.12"
  WORKING_DIR:       "./terraform"

jobs:
  # ============================================================
  # Job 1 — Python lint + unit tests
  # ============================================================
  python-tests:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================
  # Job 2 — Terraform validate & lint
  # ============================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (with dummy backend)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend=false \
            -input=false
        env:
          AWS_ACCESS_KEY_ID:     dummy
          AWS_SECRET_ACCESS_KEY: dummy

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate
        env:
          AWS_ACCESS_KEY_ID:     dummy
          AWS_SECRET_ACCESS_KEY: dummy

  # ============================================================
  # Job 3 — Package Lambdas (build artifact)
  # ============================================================
  package-lambdas:
    name: Package Lambda Functions
    runs-on: ubuntu-latest
    needs: [python-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Package ingest_gbfs
        run: |
          cd src/lambdas
          zip ingest_gbfs.zip ingest_gbfs.py

      - name: Package ingest_weather
        run: |
          cd src/lambdas
          zip ingest_weather.zip ingest_weather.py

      - name: Package maintenance
        run: |
          cd src/lambdas
          zip maintenance.zip maintenance.py

      - name: Upload Lambda packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: src/lambdas/*.zip
          retention-days: 7

  # ============================================================
  # Job 4 — Terraform Plan (PRs only → post as comment)
  # ============================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate, package-lambdas]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: src/lambdas/

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=ecobici-tf-locks" \
            -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var="s3_bucket_name=${{ secrets.S3_BUCKET_NAME }}" \
            -var="alert_email=${{ secrets.TF_VAR_ALERT_EMAIL }}" \
            -out=ecobici.tfplan \
            -no-color \
            -input=false 2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT

      - name: Post Plan as PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n... (truncated)'
              : plan;
            const body = `## 🏗️ Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ============================================================
  # Job 5 — Terraform Apply (main branch only)
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-validate, package-lambdas]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # requires manual approval in GitHub Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: src/lambdas/

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=ecobici-tf-locks" \
            -input=false

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply \
            -var="s3_bucket_name=${{ secrets.S3_BUCKET_NAME }}" \
            -var="alert_email=${{ secrets.TF_VAR_ALERT_EMAIL }}" \
            -auto-approve \
            -input=false

      - name: Output deployment summary
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output -json | jq '.'
